<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Learning Hub</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;
  background:#080812;
  color:#fff;
  overflow-x:hidden;
}

/* Background */
body::before{
  content:"";
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(circle at 30% 30%,#7f5af033,transparent 45%),
    radial-gradient(circle at 70% 40%,#2cb67d33,transparent 45%),
    radial-gradient(circle at 50% 80%,#ffffff15,transparent 40%);
  animation:bgDrift 40s linear infinite;
  z-index:-1;
}
@keyframes bgDrift{50%{transform:translate(-5%,5%) scale(1.1)}}

header{
  text-align:center;
  padding:4rem 1rem;
}
header h1{
  font-size:clamp(2.5rem,6vw,4rem);
  background:linear-gradient(90deg,#fff,#7f5af0,#2cb67d,#fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
header p{opacity:.8;margin-top:1rem}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:2rem;
  max-width:1100px;
  margin:auto;
  padding:2rem;
}

.card{
  padding:2rem;
  border-radius:20px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(15px);
  border:1px solid rgba(127,90,240,.3);
  cursor:pointer;
  transition:.3s;
}
.card:hover{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 20px 50px rgba(127,90,240,.4);
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:.3s;
}
.modal.active{opacity:1;pointer-events:auto}

.modal-content{
  max-width:600px;
  padding:2rem;
  border-radius:20px;
  background:#0f0f1e;
  line-height:1.6;
}
.modal-content b{color:#2cb67d}
.modal-content hr{margin:1rem 0;border:0;border-top:1px solid #333}

footer{
  text-align:center;
  padding:2rem;
  opacity:.7;
}
</style>
</head>

<body>

<header>
  <h1>ULTIMATE Learning Hub</h1>
  <p>Cinematic. Clean. Professional.</p>
</header>

<section class="grid">
  <div class="card" data-title="English" data-detail="We studied <b>Electromagnetism</b> and solved related questions.">🇬🇧 English</div>

  <div class="card" data-title="Science" data-detail="🔹 <b>Electric Charge & Current Flow</b><br><br>

<b>Coulomb (C)</b> is the unit of <b>electric charge</b>. It measures how much charge flows through a conductor.<br><br>

<b>Formula:</b><br>
<b>Q = I × t</b><br>
• Q = Charge (C)<br>
• I = Current (A)<br>
• t = Time (s)

<hr>

🔸 <b>Types of Current</b><br><br>

<b>1. Direct Current (DC)</b><br>
• Flows in <b>one direction</b><br>
• <b>Constant</b> over time<br>
• Example: Batteries<br>

<br>
<b>2. Alternating Current (AC)</b><br>
• Changes <b>direction repeatedly</b><br>
• <b>Not constant</b><br>
• Example: Home electricity

<hr>

🔹 <b>Summary</b><br>
• Coulomb = amount of charge<br>
• DC = one direction<br>
• AC = forward & backward">📐 Science</div>

  <div class="card" data-title="Arabic" data-detail="<b>تفسير الآية:</b><br><br>أعظم الظلم هو الكذب على الله مع معرفة الحق ورفضه، وهذا يؤدي إلى عدم الهداية.">📖 Arabic</div>
</section>

<footer>Designed like a system.</footer>

<script>
const modal=document.createElement('div');
modal.className='modal';
modal.innerHTML='<div class="modal-content"><h2 id="mTitle"></h2><p id="mText"></p></div>';
document.body.appendChild(modal);

const mTitle=modal.querySelector('#mTitle');
const mText=modal.querySelector('#mText');

document.querySelectorAll('.card').forEach(card=>{
  card.onclick=()=>{
    modal.classList.add('active');
    mTitle.innerHTML=card.dataset.title;
    mText.innerHTML=card.dataset.detail;
  };
});

modal.onclick=e=>{
  if(e.target===modal) modal.classList.remove('active');
};
</script>

</body>
</html>
